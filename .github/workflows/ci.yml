name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      # The runner image ships a Google Chrome apt source whose index has served
      # "Hash Sum mismatch" (2026-09-09); Playwright's --with-deps runs apt-get update.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google*
          sudo sed -i '/dl.google.com/d' /etc/apt/sources.list || true
          grep -rl 'dl.google.com' /etc/apt/ 2>/dev/null | xargs -r sudo rm -f
          ls /etc/apt/sources.list.d/
      - run: npx playwright install --with-deps chromium
      - run: npm run bake
      - run: npm run build
      - run: node scripts/bundle_sizes.mjs
      - run: npm run screenshot -- --budget hero=1200
      - run: npm run screenshot -- --mobile --only hero,mizbeach_kevesh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/auto
      - uses: actions/upload-artifact@v4
        with:
          name: textures
          path: public/textures
