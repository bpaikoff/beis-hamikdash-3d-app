# nginx site config template for the Beis HaMikdash 3D explorer.
# PORT (a shell-style variable) is substituted at container start by docker-entrypoint.sh
# (default 8080). Everything else is literal nginx syntax.

# Vite emits content-hashed files under /assets/, so those can be cached
# forever; index.html must always be revalidated so a new deploy is picked up.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/wasm;

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (repeated in nested locations because add_header is
    # not inherited once a location declares its own add_header).
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.sefaria.org https://tzadek.ai; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;

    # Lightweight health probe for Railway / Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # The entry document must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
    }

    # SPA fallback: unknown paths serve index.html (which is no-cache above
    # via internal redirect, since add_header on /index.html applies).
    location / {
        try_files $uri /index.html;
    }
}
